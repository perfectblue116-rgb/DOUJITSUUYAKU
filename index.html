<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>同時通訳</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1b2a2f;--sub:#6a7a7e;--line:#d9dedb;--acc:#0e7c86;--acc-ink:#fff;--rec:#d64545;--interim:#8a9a9e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10181b;--card:#182327;--ink:#e8eeee;--sub:#8fa0a4;--line:#2a393e;--acc:#38b2bd;--acc-ink:#06181b;--rec:#ef6a6a;--interim:#7d8f94;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:12px 16px 8px;display:flex;align-items:center;gap:8px}
h1{font-size:18px;margin:0;flex:1}
.ib{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px}
.langs{display:flex;gap:8px;padding:0 16px 8px;align-items:center}
select{flex:1;min-width:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
#swap{flex:none;width:44px;height:42px;font-size:18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.opts{display:flex;gap:16px;padding:0 16px 8px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:6px}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:0 16px}
.pane{flex:1;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.pane h2{margin:0;padding:8px 12px 0;font-size:12px;font-weight:600;color:var(--sub)}
.box{flex:1;overflow-y:auto;padding:6px 12px 10px;font-size:var(--fs,20px);line-height:1.55}
.box p{margin:0 0 .5em}
.interim{color:var(--interim)}
#out .box p:last-child:not(.interim){font-weight:600}
.msg{padding:6px 16px;font-size:12px;color:var(--sub);min-height:28px}
.bar{display:flex;gap:10px;padding:8px 16px 14px;align-items:center}
#mic{flex:1;height:54px;border:0;border-radius:27px;background:var(--acc);color:var(--acc-ink);font-size:17px;font-weight:700}
#mic.on{background:var(--rec);color:#fff}
#mic.on::before{content:"● ";animation:b 1.2s infinite}
@keyframes b{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){#mic.on::before{animation:none}}
.bar .ib{height:54px;padding:0 14px}
[hidden]{display:none!important}
.tag{font-size:11px;font-weight:500;color:var(--acc);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-right:6px;vertical-align:middle}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>同時通訳</h1>
  <button class="ib" id="copy">コピー</button>
  <button class="ib" id="clear">消去</button>
</header>
<div class="langs">
  <select id="src" aria-label="話す言語"></select>
  <button id="swap" aria-label="言語を入れ替え">⇄</button>
  <select id="dst" aria-label="訳す言語"></select>
</div>
<div class="opts">
  <label><input type="checkbox" id="auto" checked> 自動判定(切り替え不要)</label>
  <label><input type="checkbox" id="speak"> 訳文を読み上げ(イヤホン推奨)</label>
  <label><input type="checkbox" id="live" checked> 話し途中でも翻訳</label>
  <label>文字 <input type="range" id="fs" min="14" max="34" value="20"></label>
</div>
<main>
  <section class="pane"><h2 id="srcLabel">原文</h2><div class="box" id="inp"></div></section>
  <section class="pane"><h2 id="dstLabel">訳文</h2><div class="box" id="out"></div></section>
</main>
<div class="msg" id="msg">開始を押してマイクを許可してください。</div>
<div class="bar"><button class="ib" id="flip" hidden>聞き取り言語を切替</button><button id="mic">通訳を開始</button></div>

<script>
const LANGS=[
 ["日本語","ja-JP","ja"],["English","en-US","en"],["中文(简体)","zh-CN","zh-CN"],["한국어","ko-KR","ko"],
 ["Español","es-ES","es"],["Français","fr-FR","fr"],["Deutsch","de-DE","de"],["Português","pt-BR","pt"],
 ["Tiếng Việt","vi-VN","vi"],["ไทย","th-TH","th"],["Bahasa Indonesia","id-ID","id"],["Русский","ru-RU","ru"]
];
const $=id=>document.getElementById(id);
const src=$("src"),dst=$("dst"),inp=$("inp"),out=$("out"),msg=$("msg"),mic=$("mic");
LANGS.forEach((l,i)=>{src.add(new Option(l[0],i));dst.add(new Option(l[0],i))});
src.value=0;dst.value=1;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let running=false,token=0,timer=null,translators={};
const say=t=>msg.textContent=t;
const AUTO=()=>$("auto").checked;
const lab=()=>{
  if(AUTO()){$("srcLabel").textContent="原文(話した言語を自動判定)";$("dstLabel").textContent="訳文(もう一方の言語へ)"}
  else{$("srcLabel").textContent="原文("+LANGS[src.value][0]+")";$("dstLabel").textContent="訳文("+LANGS[dst.value][0]+")"}
};
lab();
[src,dst,$("auto")].forEach(s=>s.onchange=()=>{lab();if(running){stop();start()}});
$("swap").onclick=()=>{const a=src.value;src.value=dst.value;dst.value=a;src.onchange()};
$("fs").oninput=e=>document.documentElement.style.setProperty("--fs",e.target.value+"px");
$("clear").onclick=()=>{inp.innerHTML="";out.innerHTML=""};
$("copy").onclick=async()=>{
  const a=[...inp.querySelectorAll("p:not(.interim)")].map(p=>p.textContent),b=[...out.querySelectorAll("p:not(.interim)")].map(p=>p.textContent);
  const t=a.map((x,i)=>x+"\n→ "+(b[i]||"")).join("\n\n");
  try{await navigator.clipboard.writeText(t);say("コピーしました。")}catch{say("コピーできませんでした。")}
};

async function getJ(url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
  try{
    const r=await fetch(url,{signal:c.signal});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();
  }finally{clearTimeout(t)}
}
async function translate(text,s,d){
  const q=encodeURIComponent(text),errs=[];
  if("Translator" in self){
    try{
      const k=s+">"+d;
      if(!translators[k]){
        const av=await Translator.availability({sourceLanguage:s,targetLanguage:d});
        if(av!=="unavailable")translators[k]=await Translator.create({sourceLanguage:s,targetLanguage:d});
      }
      if(translators[k])return await translators[k].translate(text);
    }catch(e){errs.push("内蔵:"+e.message)}
  }
  const providers=[
    ["G1",async()=>{const j=await getJ("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+s+"&tl="+d+"&q="+q);return j[0].map(x=>x[0]).join("")}],
    ["G2",async()=>{const j=await getJ("https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl="+s+"&tl="+d+"&q="+q);
      if(j.sentences)return j.sentences.map(x=>x.trans||"").join("");
      if(Array.isArray(j))return Array.isArray(j[0])?j[0][0]:j[0];
      throw new Error("形式不明")}],
    ["MM",async()=>{const j=await getJ("https://api.mymemory.translated.net/get?q="+q+"&langpair="+s+"|"+d);
      if(j.responseStatus&&j.responseStatus!=200)throw new Error(String(j.responseDetails||j.responseStatus));
      return j.responseData.translatedText}]
  ];
  for(const [n,f] of providers){
    try{const r=await f();if(r)return r}catch(e){errs.push(n+":"+(e.name==="AbortError"?"timeout":e.message))}
  }
  throw new Error(errs.join(" / "));
}

function setInterim(box,text,tag){
  let p=box.querySelector("p.interim");
  if(!text){if(p)p.remove();return}
  if(!p){p=document.createElement("p");p.className="interim";box.appendChild(p)}
  p.textContent=(tag?"["+tag+"] ":"")+text;box.scrollTop=box.scrollHeight;
}
function addFinal(box,text,tag){
  setInterim(box,"");
  const p=document.createElement("p");
  if(tag){const g=document.createElement("span");g.className="tag";g.textContent=tag;p.appendChild(g)}
  p.appendChild(document.createTextNode(text));box.appendChild(p);box.scrollTop=box.scrollHeight;
}
let muted=false;
function speak(text,lang){
  if(!$("speak").checked||!("speechSynthesis" in window))return;
  const u=new SpeechSynthesisUtterance(text);u.lang=lang;
  u.onstart=()=>{muted=true};
  u.onend=u.onerror=()=>setTimeout(()=>{muted=false},400);
  speechSynthesis.speak(u);
}

let P=[0,1],recs={},active=new Set(),mode="fixed",cur=0,fin=[],finTimer=null,iv={},lastC={idx:-1,at:0},aborts=[];
const otherOf=i=>i===P[0]?P[1]:P[0];
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const NONLAT=new Set(["ja","zh-CN","ko","th","ru"]);
function resolveIdx(idx,t){
  if(!AUTO())return idx;
  const o=otherOf(idx),nl=i=>NONLAT.has(LANGS[i][2]);
  const n=t.replace(/[\s\d\p{P}]/gu,"").length;
  if(!n)return idx;
  const r=(t.match(/[A-Za-z\u00C0-\u024F]/g)||[]).length/n;
  if(nl(idx)&&!nl(o)&&r>0.8)return o;
  if(!nl(idx)&&nl(o)&&r<0.2)return o;
  return idx;
}
function updFlip(){$("flip").textContent="聞き取り中: "+LANGS[cur][0]+"(タップで切替)"}

function gotInterim(idx,t){
  if(muted)return;
  iv[idx]={t,at:Date.now()};
  const c=Object.entries(iv).filter(([k,v])=>Date.now()-v.at<1200).sort((a,b)=>b[1].t.length-a[1].t.length)[0];
  const txt=c?c[1].t:t,use=resolveIdx(c?+c[0]:idx,txt);
  setInterim(inp,txt,AUTO()?LANGS[use][0]:"");
  if(!$("live").checked)return;
  clearTimeout(timer);
  const my=++token;
  timer=setTimeout(async()=>{
    try{
      const r=await translate(txt,LANGS[use][2],LANGS[otherOf(use)][2]);
      if(my===token&&running)setInterim(out,r,AUTO()?LANGS[otherOf(use)][0]:"");
    }catch(e){say("翻訳失敗: "+e.message)}
  },500);
}
function gotFinal(idx,t,conf){
  if(muted)return;
  iv={};
  if(mode==="par"){
    if(lastC.idx!==idx&&Date.now()-lastC.at<1500)return;
    fin.push({idx,t,conf});
    if(!finTimer)finTimer=setTimeout(flush,900);
    return;
  }
  commit(idx,t);
}
function flush(){
  finTimer=null;const f=fin;fin=[];
  if(!f.length)return;
  f.sort((a,b)=>(b.conf-a.conf)||(b.t.length-a.t.length));
  commit(f[0].idx,f[0].t);
}
async function commit(idx,t){
  idx=resolveIdx(idx,t);
  if(mode==="single")flip(otherOf(idx));
  clearTimeout(timer);token++;
  lastC={idx,at:Date.now()};
  const to=otherOf(idx),tag=AUTO();
  addFinal(inp,t,tag?LANGS[idx][0]:"");
  setInterim(out,"…");
  try{
    const r=await translate(t,LANGS[idx][2],LANGS[to][2]);
    addFinal(out,r,tag?LANGS[to][0]:"");speak(r,LANGS[to][1]);
  }catch(e){addFinal(out,"(翻訳失敗)");say("翻訳失敗: "+e.message)}
}

function mk(idx){
  const r=new SR();
  r.lang=LANGS[idx][1];r.continuous=true;r.interimResults=true;
  r.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const x=e.results[i],t=x[0].transcript.trim();
      if(!t)continue;
      if(x.isFinal)gotFinal(idx,t,x[0].confidence||0);else gotInterim(idx,t);
    }
  };
  r.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){stop();say("マイクが使えませんでした("+e.error+")。設定でマイクと音声入力を許可してください。")}
    else if(e.error==="aborted"){noteAbort()}
    else if(e.error!=="no-speech")say("音声認識エラー: "+e.error);
  };
  r.onend=()=>{if(running&&active.has(idx))setTimeout(()=>{if(running&&active.has(idx)){try{r.start()}catch(e){}}},150)};
  return r;
}
function noteAbort(){
  if(mode!=="par")return;
  const n=Date.now();aborts.push(n);aborts=aborts.filter(x=>n-x<4000);
  if(aborts.length>=3)fallbackSingle();
}
function killRec(i){
  active.delete(i);
  if(recs[i]){recs[i].onend=null;recs[i].onerror=null;try{recs[i].abort()}catch(e){}}
}
function fallbackSingle(){
  mode="single";
  [P[0],P[1]].forEach(killRec);
  cur=P[0];recs[cur]=mk(cur);active.add(cur);
  setTimeout(()=>{try{recs[cur].start()}catch(e){}},300);
  $("flip").hidden=false;updFlip();
  say("この端末は2言語の同時認識に未対応のため、自動切替モードで聞き取り中:"+LANGS[cur][0]+"(認識が不安定なときは「聞き取り言語を切替」を押してください)");
}
function flip(to){
  if(mode!=="single")return;
  const n=(typeof to==="number")?to:otherOf(cur);
  if(n===cur&&recs[cur])return;
  killRec(cur);cur=n;
  recs[cur]=mk(cur);active.add(cur);
  setTimeout(()=>{if(running){try{recs[cur].start()}catch(e){}}},250);
  updFlip();say("次の聞き取り言語: "+LANGS[cur][0]+"(同じ言語で続けるときは下のボタンで切替)");
}
$("flip").onclick=()=>flip();

function start(){
  if(!SR){say("このブラウザは音声認識に未対応です。iPhoneはSafari、PCはChromeで開いてください。");return}
  const A=+src.value,B=+dst.value;
  if(AUTO()&&A===B){say("2つの言語を別々に選んでください。");return}
  P=[A,B];recs={};active=new Set();aborts=[];fin=[];iv={};
  if(AUTO()&&IOS){mode="single";recs[A]=mk(A);active.add(A);$("flip").hidden=false;cur=A;updFlip()}
  else if(AUTO()){mode="par";[A,B].forEach(i=>{recs[i]=mk(i);active.add(i)})}
  else{mode="fixed";recs[A]=mk(A);active.add(A)}
  if(mode!=="single")cur=A;running=true;mic.classList.add("on");mic.textContent="停止";
  say(mode==="single"?LANGS[A][0]+"を聞き取り中。1回話すごとに相手の言語へ自動で切り替わります。":AUTO()?LANGS[A][0]+"と"+LANGS[B][0]+"を自動判定して聞き取り中…":LANGS[A][0]+"を聞き取り中…");
  active.forEach(i=>{try{recs[i].start()}catch(e){noteAbort()}});
}
function stop(){
  running=false;mic.classList.remove("on");mic.textContent="通訳を開始";
  clearTimeout(timer);clearTimeout(finTimer);finTimer=null;token++;fin=[];iv={};
  [...active].forEach(killRec);
  Object.keys(recs).forEach(killRec);
  $("flip").hidden=true;
  setInterim(inp,"");setInterim(out,"");
  if("speechSynthesis" in window)speechSynthesis.cancel();
  muted=false;
  say("停止しました。");
}
mic.onclick=()=>running?stop():start();
(function(){
  const p=location.protocol;
  if(!SR)say("診断: このブラウザは音声認識に未対応です。Safari(iPhone)かChrome(PC)で開いてください。");
  else if(p==="file:")say("診断: ファイルから直接開いています。マイクが使えない場合は、https のURLで開いてください。");
  else if(p!=="https:"&&location.hostname!=="localhost")say("診断: https ではないためマイクが使えません。https のURLで開いてください。");
  else say("準備OK。「通訳を開始」を押してマイクを許可してください。");
})();
</script>
</body>
</html>
